<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="icon" href="transp.png" type="image/png">
    <title>asistente virtual</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#06b6d4">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .particle {
            position: absolute;
            background: radial-gradient(circle, rgba(99,102,241,0.3), transparent);
            border-radius: 50%;
            animation: floatParticle 12s infinite ease-in-out;
        }
        @keyframes floatParticle {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0; }
            50% { transform: translateY(-100vh) scale(1.5); opacity: 0.4; }
        }
        .chat-wrapper {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .chat-container {
            max-width: 500px;
            width: 100%;
            height: 85vh;
            background: rgba(30, 35, 41, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 0.6s ease-out;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .chat-header {
            background: linear-gradient(135deg, #7c3aed, #25002d);
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .bot-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #f0fb8b;
            box-shadow: 0 0 55px rgba(255, 255, 255, 0.5);
        }
        .chat-header-info { flex: 1; }
        .chat-header-info h3 {
            font-size: 1rem;
            font-weight: 700;
            color: white;
        }
        .chat-header-info p {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.7);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .online-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }
        .chat-messages::-webkit-scrollbar { width: 5px; }
        .chat-messages::-webkit-scrollbar-track {
            background: rgba(254, 180, 180, 0.05);
            border-radius: 10px;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: #a9fac8;
            border-radius: 10px;
        }
        .message {
            display: flex;
            gap: 10px;
            animation: messageSlide 0.3s ease-out;
        }
        @keyframes messageSlide {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user { flex-direction: row-reverse; }
        .message.user .bubble {
            background: linear-gradient(135deg, #7c3aed, #db2777);
            color: white;
            border-radius: 20px 20px 5px 20px;
        }
        .message.bot .bubble {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 20px 20px 20px 5px;
        }
        .message-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            object-fit: cover;
        }
        .bubble {
            max-width: 75%;
            padding: 12px 16px;
            font-size: 0.85rem;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .verse-box {
            background: rgba(252, 211, 77, 0.15);
            border-left: 3px solid #fcd34d;
            padding: 8px 12px;
            margin-top: 8px;
            border-radius: 4px;
            font-style: italic;
            font-size: 0.8rem;
            color: #fef3c7;
        }
        .input-area {
            padding: 15px 20px;
            background: rgba(0,0,0,0.3);
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex;
            gap: 12px;
        }
        .input-area input {
            flex: 1;
            padding: 12px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 40px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            transition: all 0.3s;
        }
        .input-area input:focus {
            outline: none;
            border-color: #7c3aed;
            background: rgba(255,255,255,0.08);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2);
        }
        .input-area input::placeholder { color: #64748b; }
        .input-area button {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #7c3aed, #db2777);
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .input-area button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(124, 58, 237, 0.5);
        }
        .quick-buttons {
            padding: 12px 20px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .quick-buttons button {
            padding: 8px 16px;
            background: rgb(210, 244, 245);
            border: 2px solid rgb(247, 61, 61);
            border-radius: 40px;
            color: #000000;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }
        .quick-buttons button:hover {
            background: rgba(255, 14, 14, 0.3);
            color: white;
            border-color: #7c3aed;
            transform: translateY(-2px);
        }
        .whatsapp-btn {
            background: linear-gradient(135deg, #25D366, #128C7E) !important;
            border-color: #25D366 !important;
            color: white !important;
            font-weight: 700;
        }
        .whatsapp-btn:hover {
            background: linear-gradient(135deg, #1ebe5d, #0e7a6d) !important;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
        }
        .chat-footer {
            text-align: center;
            padding: 10px;
            font-size: 0.6rem;
            color: #ffeaac;
            background: rgba(0,0,0,0.2);
        }
        .highlight-name {
            color: #fcd34d;
            font-weight: 700;
        }
        @media (max-width: 480px) {
            .chat-wrapper { padding: 5px; }
            .chat-container {
                height: 100vh;
                width: 100%;
                max-width: 100%;
                border-radius: 16px;
            }
            .bubble { max-width: 85%; font-size: 0.8rem; }
            .quick-buttons button { font-size: 0.65rem; padding: 6px 12px; }
        }
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-8px); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="particles" id="particles"></div>

<div class="chat-wrapper">
    <div class="chat-container">
        <div class="chat-header">
            <img src="virtual.png" class="bot-avatar" alt="Consejero">
            <div class="chat-header-info">
                <h3>ASISTENTE VIRTUAL</h3>
                <p><span class="online-dot"></span> En línea</p>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Escribe tu mensaje aquí..." autocomplete="off">
            <button id="sendBtn">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>

        <div class="quick-buttons" id="quickButtons">
            <button onclick="preguntarPorWhatsApp()" class="whatsapp-btn">
                <i class="fab fa-whatsapp"></i> escribe al WhatsApp
            </button>
        </div>

        <div class="chat-footer">
            <i class="fas fa-bible"></i>  desing-jhon  dainer arias aria$oftware © 2026.
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    console.log("📖 Consejero Bíblico cargado");

    const chatMessages = document.getElementById('chatMessages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');

    // ============================================
    // ESTADO DEL CHAT Y DATOS DEL USUARIO
    // ============================================
    let conversationStage = 'welcome'; // welcome, ask_name, ask_lastname, ask_phone, chatting
    let userData = {
        nombre: '',
        apellido: '',
        celular: ''
    };
    let conversationHistory = []; // Para guardar el historial y enviarlo

    // ============================================
    // BASE DE DATOS DE CONSEJOS BÍBLICOS
    // ============================================
    // Cada tema tiene un consejo y un versículo (RVR1960).
    const bibleAdvice = {
        tristeza: {
            consejo: "Dios está cerca de los que tienen el corazón quebrantado. No estás solo en tu dolor; Él promete consolarte y darte esperanza.",
            versiculo: "Salmos 34:18 - 'Cercano está Jehová a los quebrantados de corazón; y salva a los contritos de espíritu.'"
        },
        ansiedad: {
            consejo: "La ansiedad puede abrumarte, pero Dios te invita a depositar todas tus preocupaciones en Él, porque cuida de ti. Su paz sobrepasa todo entendimiento.",
            versiculo: "Filipenses 4:6-7 - 'Por nada estéis afanosos, sino sean conocidas vuestras peticiones delante de Dios en toda oración y ruego, con acción de gracias. Y la paz de Dios, que sobrepasa todo entendimiento, guardará vuestros corazones y vuestros pensamientos en Cristo Jesús.'"
        },
        miedo: {
            consejo: "No temas, porque Dios está contigo. Él te fortalece y te ayuda en todo momento. Su presencia disipa todo temor.",
            versiculo: "Isaías 41:10 - 'No temas, porque yo estoy contigo; no desmayes, porque yo soy tu Dios que te esfuerzo; siempre te ayudaré, siempre te sustentaré con la diestra de mi justicia.'"
        },
        fe: {
            consejo: "La fe es la certeza de lo que se espera, la convicción de lo que no se ve. Aferrándote a Dios, puedes confiar en Sus promesas aunque no veas el resultado inmediato.",
            versiculo: "Hebreos 11:1 - 'Es, pues, la fe la certeza de lo que se espera, la convicción de lo que no se ve.'"
        },
        soledad: {
            consejo: "Aunque te sientas solo, Dios promete que nunca te abandonará ni te desamparará. Él está contigo siempre, hasta el fin del mundo.",
            versiculo: "Deuteronomio 31:6 - 'Esforzaos y cobrad ánimo; no temáis, ni tengáis miedo de ellos, porque Jehová tu Dios es el que va contigo; no te dejará, ni te desamparará.'"
        },
        perdon: {
            consejo: "El perdón es un mandato y un regalo. Dios nos perdona en Cristo, y nos llama a perdonar a otros para vivir en libertad y paz.",
            versiculo: "Efesios 4:32 - 'Antes sed benignos unos con otros, misericordiosos, perdonándoos unos a otros, como Dios también os perdonó a vosotros en Cristo.'"
        },
        gratitud: {
            consejo: "La gratitud transforma nuestra perspectiva. Da gracias a Dios en toda circunstancia, porque Su voluntad es buena, agradable y perfecta.",
            versiculo: "1 Tesalonicenses 5:18 - 'Dad gracias en todo, porque esta es la voluntad de Dios para con vosotros en Cristo Jesús.'"
        },
        fuerza: {
            consejo: "Cuando sientas que no puedes más, recuerda que la fuerza viene de Dios. Él te sostiene y te levanta.",
            versiculo: "Isaías 40:31 - 'Pero los que esperan a Jehová tendrán nuevas fuerzas; levantarán alas como las águilas; correrán, y no se cansarán; caminarán, y no se fatigarán.'"
        },
        sabiduria: {
            consejo: "Si necesitas sabiduría, pídela a Dios, que da a todos abundantemente y sin reproche. Él te guiará en cada decisión.",
            versiculo: "Santiago 1:5 - 'Y si alguno de vosotros tiene falta de sabiduría, pídala a Dios, el cual da a todos abundantemente y sin reproche, y le será dada.'"
        },
        proposito: {
            consejo: "Dios tiene un plan perfecto para tu vida, planes de bienestar y no de mal, para darte un futuro y una esperanza. Confía en Su dirección.",
            versiculo: "Jeremías 29:11 - 'Porque yo sé los pensamientos que tengo acerca de vosotros, dice Jehová, pensamientos de paz, y no de mal, para daros el fin que esperáis.'"
        }
    };

    // ============================================
    // FUNCIONES DEL CHAT
    // ============================================

    function addMessage(text, isUser = true, extraHTML = '') {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;
        
        let bubbleContent = text + extraHTML;
        
        if (isUser) {
            messageDiv.innerHTML = `
                <div class="bubble">
                    ${escapeHtml(text)}
                    <div style="font-size: 0.6rem; margin-top: 5px; color: rgba(255,255,255,0.4);">
                        <i class="far fa-clock"></i> ${getCurrentTime()}
                    </div>
                </div>
            `;
            // Guardar en historial
            conversationHistory.push({ role: 'user', content: text });
        } else {
            messageDiv.innerHTML = `
                <img src="virtual.png" class="message-avatar" alt="Bot">
                <div class="bubble">
                    ${bubbleContent}
                    <div style="font-size: 0.6rem; margin-top: 5px; color: rgba(255,255,255,0.4);">
                        <i class="far fa-clock"></i> ${getCurrentTime()}
                    </div>
                </div>
            `;
            // Guardar en historial (versión sin HTML para WhatsApp)
            const plainText = bubbleContent.replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim();
            conversationHistory.push({ role: 'bot', content: plainText });
        }
        
        chatMessages.appendChild(messageDiv);
        scrollToBottom();
    }

    function showTypingIndicator() {
        const typingDiv = document.createElement('div');
        typingDiv.className = 'message bot';
        typingDiv.id = 'typingIndicator';
        typingDiv.innerHTML = `
            <img src="virtual.png" class="message-avatar" alt="Bot">
            <div style="display:flex;gap:4px;padding:10px 16px;background:rgba(255,255,255,0.1);border-radius:20px;width:fit-content;">
                <span style="width:8px;height:8px;background:#94a3b8;border-radius:50%;animation:typing 1.4s infinite;"></span>
                <span style="width:8px;height:8px;background:#94a3b8;border-radius:50%;animation:typing 1.4s infinite;animation-delay:0.2s;"></span>
                <span style="width:8px;height:8px;background:#94a3b8;border-radius:50%;animation:typing 1.4s infinite;animation-delay:0.4s;"></span>
            </div>
        `;
        chatMessages.appendChild(typingDiv);
        scrollToBottom();
    }

    function hideTypingIndicator() {
        const indicator = document.getElementById('typingIndicator');
        if (indicator) indicator.remove();
    }

    // ============================================
    // FLUJO DE LA CONVERSACIÓN
    // ============================================

    function showWelcomeMessage() {
        const welcomeMsg = `
            ¡Hola! Soy ANA tu <strong>asistente</strong>.
            <br>
            <span style="font-size: 0.75rem; color: rgba(255,255,255,0.7);">
            Estoy aquí para escucharte y compartir la Palabra de Dios contigo.
            </span>
            <br><br>
            Para comenzar, <strong>¿cuál es tu nombre?</strong>
        `;
        addMessage(welcomeMsg, false);
        conversationStage = 'ask_name';
    }

    function askLastName() {
        const msg = `Mucho gusto, <strong style="color: #fcd34d;">${escapeHtml(userData.nombre)}</strong>. <br>¿Cuál es tu <strong>apellido</strong>?`;
        addMessage(msg, false);
        conversationStage = 'ask_lastname';
    }

    function askPhone() {
        const msg = `Gracias, <strong style="color: #fcd34d;">${escapeHtml(userData.nombre)} ${escapeHtml(userData.apellido)}</strong>. <br>Por último, <strong>¿cuál es tu número de celular?</strong> (solo números)`;
        addMessage(msg, false);
        conversationStage = 'ask_phone';
    }

    function startBibleChat() {
        const msg = `
            ¡Dios te bendiga, <strong style="color: #fcd34d;">${escapeHtml(userData.nombre)}</strong>! 
            <br><br>
            Ya puedes contarme lo que sientes o preguntarme lo que necesites. 
            Buscaré un consejo y un versículo de la Biblia para ti.
            <br>
            <span style="font-size: 0.75rem; color: rgba(255,255,255,0.6);">
            Puedes escribir, por ejemplo: "estoy triste", "tengo ansiedad", "necesito fuerza"...
            </span>
        `;
        addMessage(msg, false);
        conversationStage = 'chatting';
    }

    // ============================================
    // RESPUESTA BÍBLICA BASADA EN PALABRAS CLAVE
    // ============================================
    function getBibleAdvice(message) {
        const msgLower = message.toLowerCase();
        
        const keywordsMap = {
            tristeza: ['triste', 'tristeza', 'deprimido', 'depresión', 'llorar', 'dolor', 'sufrimiento'],
            ansiedad: ['ansiedad', 'ansioso', 'preocupado', 'estrés', 'afán', 'nervios'],
            miedo: ['miedo', 'temor', 'asustado', 'pánico'],
            fe: ['fe', 'creer', 'confiar', 'duda'],
            soledad: ['solo', 'soledad', 'abandonado'],
            perdon: ['perdón', 'perdonar', 'rencor', 'ofensa'],
            gratitud: ['gracias', 'agradecido', 'gratitud'],
            fuerza: ['fuerza', 'débil', 'cansado', 'agotado', 'no puedo más'],
            sabiduria: ['sabiduría', 'decisión', 'guiar', 'consejo'],
            proposito: ['propósito', 'futuro', 'plan', 'esperanza', 'dirección']
        };

        let matchedTopic = null;
        for (const [topic, keywords] of Object.entries(keywordsMap)) {
            if (keywords.some(kw => msgLower.includes(kw))) {
                matchedTopic = topic;
                break;
            }
        }

        if (matchedTopic && bibleAdvice[matchedTopic]) {
            const advice = bibleAdvice[matchedTopic];
            const responseText = `
                ${advice.consejo}
                <div class="verse-box">
                    <i class="fas fa-book-open"></i> <strong>${advice.versiculo.split(' - ')[0]}</strong><br>
                    "${advice.versiculo.split(' - ')[1]}"
                </div>
            `;
            return responseText;
        }

        // Respuesta por defecto si no se detecta un tema específico
        const defaultMsg = `
            Gracias por compartir, <strong style="color: #fcd34d;">${escapeHtml(userData.nombre)}</strong>. 
            <br>
            Dios te ama y tiene un propósito para tu vida. Te animo a buscarle en oración y a confiar en Sus promesas.
            <div class="verse-box">
                <i class="fas fa-book-open"></i> <strong>Salmos 37:5</strong><br>
                "Encomienda a Jehová tu camino, y confía en él; y él hará."
            </div>
            <br>
            Si quieres, puedo darte un consejo más específico. Dime cómo te sientes: ¿triste, ansioso, con miedo, necesitas fuerza...?
             <br>
             o si prefieres escribir al WHATSAPP usa el boton verde de abajo
        `;
        return defaultMsg;
    }

    // ============================================
    // PROCESAR MENSAJE DEL USUARIO
    // ============================================
    function processUserMessage(message) {
        const trimmed = message.trim();
        if (!trimmed) return;

        addMessage(trimmed, true);
        messageInput.value = "";

        // ---------- FLUJO DE RECOLECCIÓN DE DATOS ----------
        if (conversationStage === 'ask_name') {
            userData.nombre = trimmed.charAt(0).toUpperCase() + trimmed.slice(1).toLowerCase();
            askLastName();
            return;
        }

        if (conversationStage === 'ask_lastname') {
            userData.apellido = trimmed.charAt(0).toUpperCase() + trimmed.slice(1).toLowerCase();
            askPhone();
            return;
        }

        if (conversationStage === 'ask_phone') {
            // Limpiar el número: solo dígitos
            const phoneClean = trimmed.replace(/\D/g, '');
            if (phoneClean.length < 7) {
                addMessage("⚠️ Por favor, ingresa un número de celular válido (al menos 7 dígitos).", false);
                return;
            }
            userData.celular = phoneClean;
            startBibleChat();
            return;
        }

        // ---------- ETAPA DE CONVERSACIÓN BÍBLICA ----------
        if (conversationStage === 'chatting') {
            showTypingIndicator();
            setTimeout(() => {
                hideTypingIndicator();
                const adviceHTML = getBibleAdvice(trimmed);
                addMessage(adviceHTML, false);
            }, 800);
            return;
        }
    }

    // ============================================
    // ENVIAR POR WHATSAPP
    // ============================================
    window.preguntarPorWhatsApp = function() {
        // Verificar que ya tengamos los datos
        if (!userData.nombre || !userData.apellido || !userData.celular) {
            addMessage("Aún no has completado tus datos. Por favor, sigue el flujo de la conversación para poder enviar el resumen.", false);
            return;
        }

        // Construir el mensaje con el historial
        let mensaje = `*📋 Resumen de Consejería Bíblica*\n\n`;
        mensaje += `*Nombre:* ${userData.nombre} ${userData.apellido}\n`;
        mensaje += `*Celular:* ${userData.celular}\n`;
        mensaje += `*Fecha:* ${new Date().toLocaleString()}\n\n`;
        mensaje += `*— Historial de la conversación —*\n\n`;

        conversationHistory.forEach(entry => {
            if (entry.role === 'user') {
                mensaje += `👤 *Tú:* ${entry.content}\n`;
            } else {
                mensaje += `🤖 *Consejero:* ${entry.content}\n\n`;
            }
        });

        // Número de WhatsApp de destino (el tuyo, el creador)
        const numeroDestino = "3138094678"; // <--- CAMBIA AQUÍ SI ES NECESARIO
        
        // Codificar el mensaje para la URL
        const mensajeCodificado = encodeURIComponent(mensaje);
        
        // Crear enlace wa.me
        const urlWhatsApp = `https://wa.me/${numeroDestino}?text=${mensajeCodificado}`;
        
        // Abrir en una nueva pestaña
        window.open(urlWhatsApp, '_blank');
        
        // Feedback en el chat
        addMessage("✅ Se ha abierto WhatsApp con el resumen de la conversación. Solo debes presionar 'Enviar'.", false);
    };

    // ============================================
    // UTILIDADES
    // ============================================
    function scrollToBottom() {
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function getCurrentTime() {
        const now = new Date();
        let hours = now.getHours();
        let minutes = now.getMinutes();
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;
        minutes = minutes.toString().padStart(2, '0');
        return `${hours}:${minutes} ${ampm}`;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML.replace(/\n/g, '<br>');
    }

    // ============================================
    // EVENT LISTENERS
    // ============================================
    sendBtn.addEventListener('click', () => {
        const message = messageInput.value.trim();
        if (message) processUserMessage(message);
    });

    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const message = messageInput.value.trim();
            if (message) processUserMessage(message);
        }
    });

    // ============================================
    // INICIALIZAR
    // ============================================
    showWelcomeMessage();

    // ============================================
    // PARTÍCULAS DE FONDO
    // ============================================
    function createParticles() {
        const container = document.getElementById('particles');
        if (container) {
            for (let i = 0; i < 60; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                particle.style.width = `${Math.random() * 6 + 2}px`;
                particle.style.height = particle.style.width;
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.animationDuration = `${Math.random() * 15 + 8}s`;
                particle.style.animationDelay = `${Math.random() * 5}s`;
                container.appendChild(particle);
            }
        }
    }
    createParticles();

    console.log('%c📖 Consejero Bíblico listo', 'color: #7c3aed; font-size: 14px; font-weight: bold;');
});
</script>
